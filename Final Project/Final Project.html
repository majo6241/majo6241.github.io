<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enter Your Phone Number</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 24px;
    }

    .phone-inputs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      max-width: 500px;
      margin: 0 auto 24px;
    }

    .phone-inputs input {
      width: 38px;
      height: 48px;
      font-size: 1.5rem;
      text-align: center;
      border: 1px solid #999;
      border-radius: 6px;
    }

    button {
      padding: 12px 28px;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Enter your Phone Number</h1>

  <form>
    <div class="phone-inputs">
      <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 1">
      <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2">
      <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 3">
      <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4">
      <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 5">
      <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 6">
      <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 7">
      <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 8">
      <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 9">
      <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 10">
    </div>

    <button type="submit">Continue</button>
  </form>
</body>
</html>
